    community: [["אח גדול מתנדב", "תוכנית חונכות · 2022 – 2023"], ["מדריך נוער, תנועת הצופים", "צופים · 2016 – 2018"]],
    h_additional: "נוסף",
    additional: "רכיבה תחרותית על סוסים.",
    footer_left: "© 2026 איתי פורמן",
    footer_right: "עודכן באוקטובר 2026"
  }
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = id => document.getElementById(id);

function entryHTML(e) {
  return `<article class="entry">
    <div class="when">${esc(e.when)}</div>
    <div>
      <h3>${esc(e.title)}</h3>
      ${e.org ? `<p class="org">${esc(e.org)}</p>` : ""}
      ${e.note ? `<p class="note">${esc(e.note)}</p>` : ""}
      ${e.desc ? `<p class="desc">${esc(e.desc)}</p>` : ""}
      ${e.bullets ? `<ul>${e.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}
    </div>
  </article>`;
}

function render(lang) {
  const t = T[lang];
  const root = document.documentElement;
  root.lang = lang;
  root.dir = lang === "he" ? "rtl" : "ltr";
  document.title = t.name;

  document.querySelectorAll("[data-t]").forEach(el => {
    const v = t[el.dataset.t];
    if (el.hasAttribute("data-html")) el.innerHTML = v; else el.textContent = v;
  });
  $("lang-toggle").textContent = t.switchTo;
  $("lang-toggle").setAttribute("lang", lang === "en" ? "he" : "en");

  const contact = [];
  if (CONTACT.email) contact.push(`<li><a class="primary" href="mailto:${esc(CONTACT.email)}">${ICONS.email}${esc(t.emailMe)}</a></li><li><span class="ltr">${esc(CONTACT.email)}</span></li>`);
  if (CONTACT.linkedin) contact.push(`<li><a href="${esc(CONTACT.linkedin)}" target="_blank" rel="noopener">${ICONS.linkedin}${esc(t.linkedin)}</a></li>`);
  if (CONTACT.phone) contact.push(`<li><a href="tel:${esc(CONTACT.phone.replace(/[^+\d]/g, ""))}">${ICONS.phone}<span class="ltr">${esc(CONTACT.phone)}</span></a></li>`);
  contact.push(`<li><span>${ICONS.pin}${esc(t.location)}</span></li>`);
  $("contact").innerHTML = contact.join("");

  $("glance").innerHTML = t.glance.map(([k, v, s]) =>
    `<div><span class="label">${esc(k)}</span><strong>${esc(v)}</strong><small>${esc(s)}</small></div>`).join("");
  $("experience").innerHTML = t.experience.map(entryHTML).join("");
  $("education").innerHTML = t.education.map(entryHTML).join("");
  $("competencies").innerHTML = t.competencies.map(c => `<li>${esc(c)}</li>`).join("");
  $("skills").innerHTML = t.skills.map(([k, items]) =>
    `<div class="skill-group"><span class="label">${esc(k)}</span><ul class="chips">${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>`).join("");
  const kv = rows => rows.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("");
  $("languages").innerHTML = kv(t.languages);
  $("community").innerHTML = kv(t.community);
}

// Language: #he / #en in the link wins, then the visitor's last choice, then English.
function initialLang() {
  const h = location.hash.replace("#", "");
  if (h === "he" || h === "en") return h;
  try { const s = localStorage.getItem("lang"); if (s === "he" || s === "en") return s; } catch (e) {}
  return "en";
}
let current = initialLang();
render(current);
$("lang-toggle").addEventListener("click", () => {
  current = current === "en" ? "he" : "en";
  render(current);
  try { localStorage.setItem("lang", current); } catch (e) {}
});
</script>
