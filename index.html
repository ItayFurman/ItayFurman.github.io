<style>
  /* Layout: a quiet supervisory-report page. Header with portrait, then a two-column body:
     a sticky side ledger (skills, languages, community) and a main column of dated entries.
     Logical properties throughout so the whole page mirrors cleanly in Hebrew (RTL). */
  :root {
    --paper: #f5f7f7;
    --surface: #ffffff;
    --ink: #13242c;
    --muted: #55666e;
    --rule: #d6dfe1;
    --accent: #1d5b68;
    --accent-soft: #e2eef0;

    --display: "Frank Ruhl Libre", "Times New Roman", serif;
    --body: "IBM Plex Sans", "IBM Plex Sans Hebrew", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;

    --step-0: 1rem;
    --step-1: 1.125rem;
    --step-2: 1.5rem;
    --step-3: clamp(2.4rem, 5vw + 1rem, 3.6rem);
    --label: .75rem;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #0e191e;
      --surface: #142329;
      --ink: #e3eced;
      --muted: #97a9ae;
      --rule: #263a42;
      --accent: #7cc0cd;
      --accent-soft: #1a333a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #0e191e;
    --surface: #142329;
    --ink: #e3eced;
    --muted: #97a9ae;
    --rule: #263a42;
    --accent: #7cc0cd;
    --accent-soft: #1a333a;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    font-size: var(--step-0);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1080px;
    margin-inline: auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  @media (min-width: 640px) {
    .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); }
  }
  a { color: var(--accent); text-underline-offset: 3px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

  .label {
    font-family: var(--mono);
    font-size: var(--label);
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  :lang(he) .label { letter-spacing: 0; text-transform: none; font-family: var(--body); font-size: .8rem; }

  /* ---------- header ---------- */
  header { border-bottom: 1px solid var(--rule); background: var(--surface); }
  .topbar {
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    padding-block: 18px;
  }
  .lang-btn {
    font: 500 .85rem var(--body);
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
  }
  .lang-btn:hover { border-color: var(--accent); color: var(--accent); }

  .hero {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: clamp(20px, 4vw, 48px);
    align-items: center;
    padding-block: 28px 44px;
  }
  .portrait {
    width: clamp(112px, 18vw, 184px);
    aspect-ratio: 1;
    max-width: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid var(--surface);
    box-shadow: 0 0 0 2px var(--accent);
  }
  h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: var(--step-3);
    line-height: 1.05;
    margin: 0 0 10px;
    letter-spacing: -.01em;
    text-wrap: balance;
  }
  .role { font-size: var(--step-1); font-weight: 600; color: var(--accent); margin: 0; }
  .role span { color: var(--muted); font-weight: 400; }
  .contact {
    display: flex; flex-wrap: wrap; gap: 8px 10px;
    margin-top: 20px; padding: 0; list-style: none;
  }
  .contact a, .contact span {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: .9rem; text-decoration: none; color: var(--ink);
    padding: 7px 14px; border: 1px solid var(--rule); border-radius: 999px;
    background: var(--paper);
  }
  .contact a:hover { border-color: var(--accent); color: var(--accent); }
  .contact a.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
  .contact a.primary:hover { color: var(--surface); filter: brightness(1.1); }
  .contact svg { width: 15px; height: 15px; flex: none; }
  .contact .ltr { direction: ltr; unicode-bidi: isolate; }

  @media (max-width: 560px) {
    .hero { grid-template-columns: 1fr; justify-items: start; padding-block: 8px 32px; }
  }

  /* ---------- at a glance ---------- */
  .glance {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-bottom: 1px solid var(--rule);
  }
  .glance div {
    padding: 22px 20px 22px 0;
    padding-inline: 0 20px;
    border-inline-end: 1px solid var(--rule);
  }
  .glance div + div { padding-inline-start: 20px; }
  .glance div:last-child { border-inline-end: 0; }
  .glance strong { display: block; font-family: var(--display); font-size: 1.25rem; font-weight: 500; line-height: 1.25; margin-top: 6px; }
  .glance small { display: block; color: var(--muted); font-size: .85rem; margin-top: 2px; }
  @media (max-width: 820px) {
    .glance { grid-template-columns: 1fr 1fr; }
    .glance div { border-inline-end: 0; padding-inline: 0 !important; border-bottom: 1px solid var(--rule); }
    .glance div:nth-last-child(-n+2) { border-bottom: 0; }
    .glance div:nth-child(odd) { padding-inline-end: 16px !important; }
  }
  @media (max-width: 420px) {
    .glance { grid-template-columns: 1fr; }
    .glance div:nth-last-child(2) { border-bottom: 1px solid var(--rule); }
  }

  /* ---------- body ---------- */
  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 56px;
    padding-block: 48px 64px;
    align-items: start;
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; gap: 40px; padding-block: 36px 48px; }
    .layout aside { order: 2; position: static !important; }
  }
  aside { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); display: grid; gap: 32px; }
  main { display: grid; gap: 48px; min-width: 0; }

  h2 {
    font-family: var(--display);
    font-weight: 500;
    font-size: var(--step-2);
    margin: 0 0 18px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--rule);
  }
  aside h2 { font-size: 1.15rem; margin-bottom: 14px; }

  .profile p { margin: 0; max-width: 62ch; font-size: 1.05rem; }
  .profile b { font-weight: 600; color: var(--accent); }

  .entries { display: grid; gap: 30px; }
  .entry {
    display: grid;
    grid-template-columns: 128px 1fr;
    gap: 20px;
  }
  .entry .when {
    font-family: var(--mono);
    font-size: .82rem;
    color: var(--muted);
    padding-top: 4px;
    font-variant-numeric: tabular-nums;
    direction: ltr;
    text-align: start;
    unicode-bidi: isolate;
  }
  :lang(he) .entry .when { text-align: right; }
  .entry h3 { margin: 0; font-size: var(--step-1); font-weight: 600; line-height: 1.35; }
  .entry .org { margin: 2px 0 0; color: var(--accent); font-size: .95rem; }
  .entry .note { margin: 2px 0 0; color: var(--muted); font-size: .88rem; }
  .entry p.desc { margin: 10px 0 0; max-width: 64ch; }
  .entry ul { margin: 10px 0 0; padding-inline-start: 18px; display: grid; gap: 4px; max-width: 64ch; }
  .entry li::marker { color: var(--accent); }
  @media (max-width: 560px) {
    .entry { grid-template-columns: 1fr; gap: 4px; }
    .entry .when { padding-top: 0; }
  }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .chips li {
    font-size: .82rem; padding: 3px 10px; border-radius: 4px;
    background: var(--accent-soft); color: var(--ink);
  }
  .skill-group { display: grid; gap: 8px; }
  .skill-group + .skill-group { margin-top: 16px; }

  .kv { display: grid; gap: 12px; margin: 0; }
  .kv div { display: grid; gap: 0; }
  .kv dt { font-weight: 600; }
  .kv dd { margin: 0; color: var(--muted); font-size: .9rem; }

  footer { border-top: 1px solid var(--rule); padding-block: 24px 32px; color: var(--muted); font-size: .85rem; }
  footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; }

  @media (prefers-reduced-motion: no-preference) {
    .reveal { animation: rise .5s ease-out both; }
    @keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
  }
</style>

      { when: "2018", title: "מכינה קדם־צבאית", org: "פארן, הערבה" }
    ],
    h_competencies: "יכולות ליבה",
    competencies: ["ניתוח רגולטורי ומדיניות", "ניתוח כמותי וסטטיסטי", "דוחות כספיים", "ניתוח נתונים", "אקונומטריקה", "כתיבת דוחות"],

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = id => document.getElementById(id);

function entryHTML(e) {
  return `<article class="entry">
    <div class="when">${esc(e.when)}</div>
    <div>
      <h3>${esc(e.title)}</h3>
      ${e.org ? `<p class="org">${esc(e.org)}</p>` : ""}
      ${e.note ? `<p class="note">${esc(e.note)}</p>` : ""}
      ${e.desc ? `<p class="desc">${esc(e.desc)}</p>` : ""}
      ${e.bullets ? `<ul>${e.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}
    </div>
  </article>`;
}

function render(lang) {
  const t = T[lang];
  const root = document.documentElement;
  root.lang = lang;
  root.dir = lang === "he" ? "rtl" : "ltr";
  document.title = t.name;

  document.querySelectorAll("[data-t]").forEach(el => {
    const v = t[el.dataset.t];
    if (el.hasAttribute("data-html")) el.innerHTML = v; else el.textContent = v;
  });
  $("lang-toggle").textContent = t.switchTo;
  $("lang-toggle").setAttribute("lang", lang === "en" ? "he" : "en");

  const contact = [];
  if (CONTACT.email) contact.push(`<li><a class="primary" href="mailto:${esc(CONTACT.email)}">${ICONS.email}${esc(t.emailMe)}</a></li><li><span class="ltr">${esc(CONTACT.email)}</span></li>`);
  if (CONTACT.linkedin) contact.push(`<li><a href="${esc(CONTACT.linkedin)}" target="_blank" rel="noopener">${ICONS.linkedin}${esc(t.linkedin)}</a></li>`);
  if (CONTACT.phone) contact.push(`<li><a href="tel:${esc(CONTACT.phone.replace(/[^+\d]/g, ""))}">${ICONS.phone}<span class="ltr">${esc(CONTACT.phone)}</span></a></li>`);
  contact.push(`<li><span>${ICONS.pin}${esc(t.location)}</span></li>`);
  $("contact").innerHTML = contact.join("");

  $("glance").innerHTML = t.glance.map(([k, v, s]) =>
    `<div><span class="label">${esc(k)}</span><strong>${esc(v)}</strong><small>${esc(s)}</small></div>`).join("");
  $("experience").innerHTML = t.experience.map(entryHTML).join("");
  $("education").innerHTML = t.education.map(entryHTML).join("");
  $("competencies").innerHTML = t.competencies.map(c => `<li>${esc(c)}</li>`).join("");
  $("skills").innerHTML = t.skills.map(([k, items]) =>
    `<div class="skill-group"><span class="label">${esc(k)}</span><ul class="chips">${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>`).join("");
  const kv = rows => rows.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("");
  $("languages").innerHTML = kv(t.languages);
  $("community").innerHTML = kv(t.community);
}

// Language: #he / #en in the link wins, then the visitor's last choice, then English.
function initialLang() {
  const h = location.hash.replace("#", "");
  if (h === "he" || h === "en") return h;
  try { const s = localStorage.getItem("lang"); if (s === "he" || s === "en") return s; } catch (e) {}
  return "en";
}
let current = initialLang();
render(current);
$("lang-toggle").addEventListener("click", () => {
  current = current === "en" ? "he" : "en";
  render(current);
  try { localStorage.setItem("lang", current); } catch (e) {}
});
</script>
